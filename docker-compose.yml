services:
  app:
    image: ${CHATGPT2API_IMAGE:-ghcr.io/yukkcat/chatgpt2api:latest}
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "${CHATGPT2API_PORT:-3000}:80"
    volumes:
      - chatgpt2api-runtime:/app
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      CHATGPT2API_THREAD_TOKENS: ${CHATGPT2API_THREAD_TOKENS:-120}
      # CPU 默认使用通用轻量模型，再用高质量缩放收敛到 2K/4K。
      # 有 GPU 时可显式改回 RealESRGAN_RealESRGAN_x4plus_4x.pth。
      CHATGPT2API_FINAL2X_MODEL: ${CHATGPT2API_FINAL2X_MODEL:-realesr-general-x4v3.pth}
      CHATGPT2API_FINAL2X_DEVICE: ${CHATGPT2API_FINAL2X_DEVICE:-cpu}
      CHATGPT2API_FINAL2X_TIMEOUT_SECONDS: ${CHATGPT2API_FINAL2X_TIMEOUT_SECONDS:-600}
      TZ: ${TZ:-Asia/Shanghai}

volumes:
  chatgpt2api-runtime:
